title: "PaSO — Payments and SCA for OpenID"
description: "The trust and proof layer that lets OpenID wallets satisfy Strong Customer Authentication. Built on OpenID4VCI and OpenID4VP. Aligned with PSD2 and eIDAS 2.0."
url: ""
baseurl: "/payments-and-sca-for-openid"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: "specs"
    values:
      layout: default
  - scope:
      path: "rulebooks"
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
