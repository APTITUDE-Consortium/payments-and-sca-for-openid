site_name: Payment and SCA for OpenID
site_url: https://aptitude-consortium.github.io/payments-and-sca-for-openid/
theme:
  name: material
  palette:
    primary: black
extra:
  version:
    provider: mike
    default: stable
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format